[package]
name = "availability-tracker"
description = "Track availability of address over time"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "track-availability"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false }
humantime = "2.3.0"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
signal-hook = "0.4.4"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
